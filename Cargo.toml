[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.1"
license = "MIT"
repository = "https://github.com/binary-companion/calendar-connectors"

# Exact versions (conventions section 3), newest release when phase 0 started (2026-11-10). Default features are
# off wherever the crate builds without them; crates say `foo = { workspace = true }`.
[workspace.dependencies]
calendar-core = { path = "crates/calendar-core" }
calendar-oauth = { path = "crates/calendar-oauth" }
calendar-ical = { path = "crates/calendar-ical" }
calendar-google = { path = "crates/calendar-google" }
calendar-microsoft = { path = "crates/calendar-microsoft" }
calendar-caldav = { path = "crates/calendar-caldav" }
calendar-ical-subscription = { path = "crates/calendar-ical-subscription" }
calendar-test-support = { path = "crates/calendar-test-support" }

serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }
serde_json = { version = "=1.0.154", default-features = false, features = ["std"] }
# The zone database: the system one on macOS and Linux, a bundled one on Windows, iOS and Android (jiff-tzdb-platform).
jiff = { version = "=0.2.42", default-features = false, features = ["serde", "std", "tz-system", "tz-fat", "tzdb-bundle-platform", "tzdb-zoneinfo", "tzdb-concatenated"] }
quick-xml = { version = "=0.42.0", default-features = false }
sha2 = { version = "=0.11.1", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
uuid = { version = "=1.29.2", default-features = false, features = ["v4"] }
url = { version = "=2.5.8", default-features = false, features = ["std"] }
thiserror = { version = "=2.0.21", default-features = false }
async-trait = { version = "=0.1.92" }
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time", "sync", "macros"] }
base64 = { version = "=0.23.1", default-features = false, features = ["std"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"

[profile.release]
opt-level = "s"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
