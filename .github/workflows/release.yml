# Releases the library. Every push to main publishes the next X.Y.Z tag and a GitHub release.
# The bump comes from the semver:* labels of the merged pull requests since the latest tag (patch
# by default; the highest wins, so a replaced pending run cannot lose a major). Nothing is released
# while the repository has no X.Y.Z tag (the first version is dispatched by hand), nor when the
# pushed commit already carries one (a re-run).
#
# The v2 line (Rust) has a prerelease path: dispatch this workflow on the v2 ref with the `prerelease` input
# (`gh workflow run Release --repo binary-companion/calendar-connectors --ref v2 -f prerelease=alpha.1`). It tags the
# v2 commit 2.0.0-<prerelease> and publishes a GitHub prerelease: no package (this repository has none) and no
# `library-released` dispatch, so no dependent is told. It is refused on any other ref. The strict X.Y.Z tag
# patterns elsewhere (this file, compat.py) never match a prerelease tag, so 1.x releases from main are unaffected.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: "X.Y.Z to publish. Needed for the first release and for recovery. A version lower than the latest tag is refused; the latest tag itself recovers its missing release."
        required: false
        type: string
      prerelease:
        description: "On the v2 ref only: publish 2.0.0-<prerelease> as a GitHub prerelease (for example alpha.1). No package, no dependents notified."
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  publish:
    # A dispatch that carries a prerelease is never a normal release, whatever its ref.
    if: github.ref == 'refs/heads/main' && inputs.prerelease == ''
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          OVERRIDE: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # The latest version is the highest strict X.Y.Z tag REACHABLE from the pushed commit, so a
          # hand-made tag on a side branch cannot over- or under-bump this release.
          latest="$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --merged "$SHA" --sort=-v:refname | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
          if [ -z "$OVERRIDE" ]; then
            tagged="$(git tag --points-at "$SHA" | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)"
            if [ -n "$tagged" ]; then
              echo "::notice::$SHA already carries $tagged; nothing to release."
              echo "version=" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          # The labels of every commit since the latest tag, not only of the pushed one: a pending
          # run that a newer push replaced must not lose its semver:major. A failed API call fails
          # the step, so a missing label never turns into a patch release.
          labels=""
          if [ -z "$OVERRIDE" ] && [ -n "$latest" ]; then
            commits="$(git rev-list "$latest..$SHA")"
            while IFS= read -r commit; do
              [ -n "$commit" ] || continue
              found="$(gh api "repos/$REPO/commits/$commit/pulls" --jq '[.[].labels[].name] | join(",")' </dev/null)"
              if [ -n "$found" ]; then labels="${labels:+$labels,}$found"; fi
            done <<< "$commits"
          fi
          status=0
          version="$(scripts/release/next-version.sh --latest "$latest" --labels "$labels" --override "$OVERRIDE")" || status=$?
          case "$status" in
            0) echo "version=$version" >> "$GITHUB_OUTPUT"
               echo "Releasing $version (latest: ${latest:-none}; labels: ${labels:-none})" ;;
            3) echo "::notice::No X.Y.Z tag exists yet; nothing is released until the first version is dispatched by hand."
               echo "version=" >> "$GITHUB_OUTPUT" ;;
            *) exit "$status" ;;
          esac
      - name: Create the tag and the release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: gh release create "$VERSION" --target "$SHA" --title "$VERSION" --generate-notes

  # Prerelease of the v2 line: the tag goes on the dispatched v2 commit. There is no environment: the publish
  # environment is limited to main, and this job only uses the workflow's own token (contents: write). Whoever can
  # dispatch a workflow on v2 can already push code there. Nothing here sends a dispatch to a dependent.
  prerelease:
    if: inputs.prerelease != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compute the prerelease version
        id: version
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          set -euo pipefail
          if [ "$REF" != "refs/heads/v2" ]; then
            echo "::error::A prerelease is published from the v2 ref only (this run is on $REF)."
            exit 1
          fi
          version="$(scripts/release/next-version.sh --prerelease "$PRERELEASE")"
          # Tags are immutable: a tag of this name on another commit is a different prerelease, not a re-run.
          existing="$(git rev-list -n 1 "refs/tags/$version" 2>/dev/null || true)"
          if [ -n "$existing" ] && [ "$existing" != "$SHA" ]; then
            echo "::error::$version already exists on $existing, not on $SHA; pick another prerelease name."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Publishing prerelease $version from $SHA"
      - name: Create the tag and the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          SHA: ${{ github.sha }}
        run: gh release create "$VERSION" --target "$SHA" --title "$VERSION" --generate-notes --prerelease

  # Tells each dependent that a version exists, so its own workflow can open a bump pull request.
  # Skipped when nothing was released. The token comes from the timetug-bot GitHub App, installed on
  # timetug and timetug-shared; the bump environment holds its credentials (the app's key) and is
  # limited to main. Every dependent is tried even when one dispatch fails; the step then fails.
  notify:
    needs: publish
    if: needs.publish.outputs.version != ''
    runs-on: ubuntu-latest
    environment: bump
    permissions:
      contents: read
    steps:
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          # app-id is deprecated upstream in favour of client-id, which needs the app's Client ID;
          # switch once that value is available. It still works.
          app-id: ${{ vars.BUMP_APP_ID }}
          private-key: ${{ secrets.BUMP_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: timetug,timetug-shared
          # Only what repository_dispatch needs: the app is installed with more, the token is not.
          permission-contents: write
      - name: Tell the dependents
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          failed=""
          for dependent in timetug timetug-shared; do
            if ! gh api "repos/binary-companion/$dependent/dispatches" \
              -f event_type=library-released \
              -f "client_payload[library]=calendar-connectors" \
              -f "client_payload[version]=$VERSION"; then
              echo "::error::The dispatch to $dependent failed."
              failed="${failed:+$failed }$dependent"
            fi
          done
          if [ -n "$failed" ]; then
            echo "::error::Not notified: $failed."
            exit 1
          fi
