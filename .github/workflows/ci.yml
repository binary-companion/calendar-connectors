# Continuous integration for the library: a Cargo workspace (v2 is Rust-only). Runs on pull requests and on every push
# to main and v2. The job ids are the names the branch protection of main and v2 requires; see "Required checks" below.
#   macos, linux, windows-x64, windows-arm64
#                 cargo test --workspace and a release build on that platform (the pinned toolchain of rust-toolchain.toml).
#   architecture  crate dependency rules, the tokio feature rule, repository contracts (pinned Microsoft scopes, workflow
#                 secrets), and the tests of those checks, of the release script and of the compat tooling.
#   rust-lint     rustfmt, clippy -D warnings, cargo-deny, and the Swift-to-Rust test parity table.
#   rust-targets  release builds for the other Apple targets.
#   compat        backward compatibility with the latest 1.x release (AGENTS.md, "Backward compatibility"): the
#                 persisted-format fixtures. Skipped for semver:major.
#   rust-macos, rust-linux, rust-windows-x64, rust-windows-arm64
#                 aliases that pass when the job of the same platform above passed. The ruleset that protects v2 still
#                 lists these names as required checks; delete the aliases after the ruleset drops them.
name: CI

on:
  push:
    branches: [main, v2]
  pull_request:
    # labeled and unlabeled: adding or removing semver:major turns the compat checks off or on again.
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  # Each platform job installs the toolchain pinned in rust-toolchain.toml. The steps use bash so that a failing cargo
  # command fails the step on Windows too.
  macos:
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked

  linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked

  windows-x64:
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked

  windows-arm64:
    runs-on: windows-11-arm
    permissions:
      contents: read
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install rustup when the image has none
        shell: pwsh
        run: |
          if (-not (Get-Command rustup -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest -Uri https://static.rust-lang.org/rustup/dist/aarch64-pc-windows-msvc/rustup-init.exe -OutFile rustup-init.exe
            ./rustup-init.exe -y --default-toolchain none --profile minimal
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            "$env:USERPROFILE\.cargo\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          }
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Test
        run: cargo test --workspace --locked
      - name: Release build
        run: cargo build --workspace --release --locked

  architecture:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned test prerequisites
        run: |
          python3 -m venv build/venv
          build/venv/bin/python -m pip install -r scripts/ci/requirements-test.txt
      - name: Crate architecture and tokio features
        run: |
          python3 scripts/ci/check-crate-architecture.py
          python3 scripts/ci/check-tokio-features.py
      - name: Repository contracts
        run: build/venv/bin/python scripts/ci/check-repository-contracts.py
      - name: Tests of the checks and of the release script
        run: |
          scripts/release/tests/test-next-version.sh
          PYTHON="$PWD/build/venv/bin/python" scripts/release/tests/test-release-version-step.sh
          build/venv/bin/python -m unittest discover -s scripts/ci/tests -p 'test_*.py'

  compat:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The baseline is a release tag: its files are read from this clone.
          fetch-depth: 0
          persist-credentials: false
      - name: Decide whether the checks apply
        id: gate
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci/compat/compat.py gate --base-ref "origin/${BASE_REF:-main}"
      # The persisted formats model files on users' disks (the connection list and the sync state): an existing file
      # never changes, even additively, and is never deleted; new files (a new version directory) are fine. The
      # baseline is a 1.x tag, which keeps them under Tests/PersistedFormats; v2 moved them to fixtures/persisted-formats
      # (--moved: a baseline file must exist byte-identical at either path). The Rust tests that load them run in every
      # platform job.
      - name: Persisted-format fixtures of the baseline are unchanged
        if: ${{ !cancelled() && steps.gate.outputs.run == 'true' }}
        env:
          BASELINE: ${{ steps.gate.outputs.baseline }}
        run: python3 scripts/ci/compat/compat.py frozen "$BASELINE" --strict fixtures/persisted-formats --moved Tests/PersistedFormats=fixtures/persisted-formats

  rust-lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Keep the version equal to the one in AGENTS.md ("Rust").
      - name: Cache cargo-deny
        id: cargo-deny-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: ~/.cargo/bin/cargo-deny
          key: cargo-deny-0.20.2-${{ runner.os }}-${{ runner.arch }}-rust-1.99.1
      - name: Install cargo-deny
        if: steps.cargo-deny-cache.outputs.cache-hit != 'true'
        run: cargo install --locked cargo-deny --version 0.20.2
      - name: Licences, bans and advisories
        run: cargo deny check
      # The table of the Swift tests (frozen at the last dual-language commit) and the Rust tests that replaced them:
      # a Rust test that is renamed or deleted fails here.
      - name: Swift-to-Rust test parity
        run: |
          python3 scripts/ci/check-test-parity.py --require-complete CalendarCoreTests --require-complete CalendarOAuthTests --require-complete ICalendarTests --require-complete ICalSubscriptionTests --require-complete CalDAVCalendarTests --require-complete GoogleCalendarTests --require-complete MicrosoftCalendarTests

  rust-targets:
    runs-on: macos-26
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install the pinned Rust toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - name: Build for the other Apple targets
        run: |
          for target in x86_64-apple-darwin aarch64-apple-ios aarch64-apple-ios-sim; do
            cargo build --workspace --release --locked --target "$target"
          done

  # The ruleset "Protect v2" still lists rust-macos, rust-linux, rust-windows-x64 and rust-windows-arm64 as required
  # checks (the platform jobs had those names while Swift and Rust ran side by side). These jobs keep the names
  # reporting, and pass only when the platform job passed. always(): a skipped required check counts as passing, so a
  # skipped or failed dependency must make the alias fail, never skip it. Remove them once the ruleset drops the names.
  rust-macos:
    needs: macos
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: The platform job passed
        env:
          RESULT: ${{ needs.macos.result }}
        run: test "$RESULT" = success

  rust-linux:
    needs: linux
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: The platform job passed
        env:
          RESULT: ${{ needs.linux.result }}
        run: test "$RESULT" = success

  rust-windows-x64:
    needs: windows-x64
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: The platform job passed
        env:
          RESULT: ${{ needs.windows-x64.result }}
        run: test "$RESULT" = success

  rust-windows-arm64:
    needs: windows-arm64
    if: ${{ always() }}
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: The platform job passed
        env:
          RESULT: ${{ needs.windows-arm64.result }}
        run: test "$RESULT" = success
