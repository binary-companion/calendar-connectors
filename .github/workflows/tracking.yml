# Copy to .github/workflows/tracking.yml in a tracked repository, with .github/tracking.yml next to it
# (`projects: [binary-companion/timetug]`). Change the workflow name in workflow_run to the repo's CI workflow.
# The job runs in the `tracking` environment (create it in the repository, no protection rules needed) so the
# App credentials are only used inside a named environment, as the repository contracts require. A private
# repository on the free plan has no environments: drop the `environment:` line there.
name: Tracking
on:
  issues:
    types: [opened, closed, reopened]
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
  workflow_run:
    workflows: [CI]
    types: [completed]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tracking:
    runs-on: ubuntu-latest
    environment: tracking
    # Fork pull requests get no secrets; skip them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: binary-companion/.github/.github/actions/tracking@d8da081e41605b48fc9942089b45a451d80802a3 # main
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
